    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/%3E%3C/svg%3E" />

  <!-- Only Inter and Space Grotesk are actually used by the stylesheet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />

  <!-- Critical CSS to prevent a flash of unstyled content -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      min-height: 100vh;
    }

    #root {
      background: #0d1117;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #root.loaded {
      opacity: 1;
    }

    #pre-loader {
      position: fixed;
      inset: 0;
      background: #0d1117;
      z-index: 999999999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    #pre-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #pre-loader-text {
      font-size: clamp(2rem, 8vw, 4rem);
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #pre-loader-text {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="pre-loader">
    <span id="pre-loader-text">Loading…</span>
  </div>
  <div id="root"></div>

  <noscript>
    <p style="color:#f0f6fc;font-family:system-ui,sans-serif;text-align:center;padding:2rem">
      This portfolio needs JavaScript enabled. You can still reach me at
      <a style="color:#34d399" href="mailto:shivendrashukla06@gmail.com">shivendrashukla06@gmail.com</a>.
    </p>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
  <script>
    (function () {
      var root = document.getElementById('root');
      var preLoader = document.getElementById('pre-loader');
      var revealed = false;

      function reveal() {
        if (revealed) return;
        revealed = true;
        preLoader.classList.add('hidden');
        root.classList.add('loaded');
      }

      var observer = new MutationObserver(function () {
        if (root.children.length > 0) {
          observer.disconnect();
          setTimeout(reveal, 50);
        }
      });
      observer.observe(root, { childList: true });

      // Failsafe: never leave the page stuck on a blank #root if the bundle
      // fails to mount for any reason.
      setTimeout(function () {
        observer.disconnect();
        reveal();
      }, 5000);
    })();
  </script>
</body>

</html>
